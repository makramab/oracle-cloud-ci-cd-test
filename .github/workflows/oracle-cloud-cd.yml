name: Oracle Cloud Deployment on PR Updates

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase the branch name
        run: |
          if [ -n "$GITHUB_HEAD_REF" ]; then
            branch="$GITHUB_HEAD_REF"
          else
            branch="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH=${branch,,}" >> ${GITHUB_ENV}
      - name: Deploy latest changes on Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPOSITORY_NAME: ${{ secrets.REPOSITORY_NAME }}
          BRANCH: ${{ env.BRANCH }}
        with:
          host: ${{ secrets.ORACLE_CLOUD_HOST }}
          username: ${{ secrets.ORACLE_CLOUD_INSTANCE_USERNAME }}
          key: ${{ secrets.ORACLE_CLOUD_KEY }}
          envs: REPOSITORY_NAME, BRANCH
          script: |
            cd $REPOSITORY_NAME
            git pull
            git checkout $BRANCH
            git pull
            docker compose down
            docker compose up -d --build
