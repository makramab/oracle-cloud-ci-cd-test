name: Oracle Cloud Deployment on PR Update using GHCR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: "read"
  packages: "write"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots package -DskipTests
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Lowercase the branch name
        run: |
          if [ -n "$GITHUB_HEAD_REF" ]; then
            branch="$GITHUB_HEAD_REF"
          else
            branch="${GITHUB_REF#refs/heads/}"
          fi
          echo "BRANCH=${branch,,}" >> ${GITHUB_ENV}
      - name: Build and push container image to registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO }}:${{ github.sha }}
          file: ./Dockerfile
      - name: Run the latest Docker image on Oracle Cloud
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_IMAGE: ghcr.io/${{ env.REPO }}:${{ github.sha }}
          REPOSITORY_NAME: ${{ secrets.REPOSITORY_NAME }}
          BRANCH: ${{ env.BRANCH }}
        with:
          host: ${{ secrets.ORACLE_CLOUD_HOST }}
          username: ${{ secrets.ORACLE_CLOUD_INSTANCE_USERNAME }}
          key: ${{ secrets.ORACLE_CLOUD_KEY }}
          envs: REPOSITORY_NAME, GHCR_IMAGE, BRANCH
          script: |
            whoami
            ls -al
            cd $REPOSITORY_NAME
            git pull
            git checkout $BRANCH
            docker compose down
            docker compose up --build
